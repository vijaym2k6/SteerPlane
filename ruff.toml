# Ruff configuration for the SteerPlane monorepo
target-version = "py311"
line-length = 100

[lint]
select = ["E", "F", "W"]
ignore = [
    "E501",   # Line too long — handled by formatter, not checker
    "E712",   # Allow == True/False comparisons (SQLAlchemy filter patterns)
]

[lint.per-file-ignores]
"__init__.py" = ["F401"]  # Re-exports in __init__.py are intentional
