###############################################################################
# SteerPlane — CI/CD Pipeline
#
# Runs on every push and pull request:
#   1. Lint Python (ruff)
#   2. Test Python SDK (pytest)
#   3. Test API server (pytest)
#   4. Test TypeScript SDK
#   5. Build Docker images
###############################################################################

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ─── Python Linting ────────────────────────────────────────────────────
  lint:
    name: Lint (Python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ruff
        # Pinned deliberately. An unpinned linter means CI can fail on a day
        # nobody touched the code: ruff 0.16.6 (3 Sep 2026) widened its default
        # rule set and broke this job on an unchanged tree. Bump this on
        # purpose, with the lint fixes the new version wants, never by accident.
        run: pip install ruff==0.15.12

      - name: Run ruff check
        run: ruff check sdk/ api/ --output-format=github

      - name: Run ruff format check
        run: ruff format --check sdk/ api/

  # ─── Python SDK Tests ──────────────────────────────────────────────────
  test-sdk:
    name: Test SDK (Python)
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install SDK + dev deps
        working-directory: sdk
        run: |
          pip install -e ".[dev]"

      - name: Run SDK tests
        working-directory: sdk
        run: pytest tests/ -v --tb=short

  # ─── API Server Tests ──────────────────────────────────────────────────
  test-api:
    name: Test API Server
    runs-on: ubuntu-latest
    needs: lint
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: steerplane_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://test:test@localhost:5432/steerplane_test
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install API deps
        working-directory: api
        run: |
          pip install -r requirements.txt
          pip install pytest httpx

      - name: Run API tests
        working-directory: api
        run: pytest tests/ -v --tb=short

  # ─── TypeScript SDK Tests ──────────────────────────────────────────────
  test-ts:
    name: Test SDK (TypeScript)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install deps
        working-directory: sdk-ts
        run: npm ci 2>/dev/null || npm install

      - name: Typecheck
        working-directory: sdk-ts
        run: npx tsc --noEmit

  # ─── Docker Build ──────────────────────────────────────────────────────
  docker:
    name: Build Docker Images
    runs-on: ubuntu-latest
    needs: [test-sdk, test-api]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Build API image
        run: docker build -t steerplane-api:latest ./api

      - name: Build Dashboard image
        run: docker build -t steerplane-dashboard:latest ./dashboard
